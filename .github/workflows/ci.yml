name: Dataset-independent tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Smoke-test nested Streamlit entrypoint imports
        run: |
          python -I -c 'import runpy; import sys; from pathlib import Path; root = Path.cwd(); runpy.run_path("src/app/dashboard.py", run_name="ci_import_check"); from src.app import data; assert callable(data.build_review_queue); assert Path(data.__file__).resolve() == root / "src/app/data.py"; print("Dashboard imports passed")'
      - name: Run tests without the raw dataset
        run: python -m pytest -q -m 'not dataset'
